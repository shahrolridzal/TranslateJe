plugins {
    id 'com.android.application'          // Applies the Android application plugin
}

android {
    namespace 'com.saygo.app'             // Kotlin/Java package namespace (replaces package in manifest)
    compileSdk 35                         // Compile against Android 15 (API 35)

    defaultConfig {
        applicationId 'com.saygo.app'     // Unique app ID for Play Store and device
        minSdk 23                         // Minimum Android version: Android 6.0 (Marshmallow)
        targetSdk 35                      // Target Android 15
        versionCode 1                     // Internal version number (integer)
        versionName '0.2.0'               // User‑visible version string
    }
}
